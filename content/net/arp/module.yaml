    kind: choice
    stem: ARP 解析与帧的目的 MAC：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: ARP 把 IP 解析成 MAC，只解析下一跳：同网段问主机，跨网段问网关。
