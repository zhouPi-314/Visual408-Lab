questions:
  - id: q1
    kind: choice
    stem: 时延带宽积与利用率：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "时延带宽积 = 传播时延 × 带宽（链路能装多少 bit）；停等利用率 = 发送时延/(发送时延+2×传播时延)。"
  - id: q2
    kind: hand-calculation
    stem: 时延带宽积与利用率：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
