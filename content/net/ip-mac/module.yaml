    stem: 跨网段 IP 与 MAC：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "源/目的 IP 端到端不变；MAC 每过一跳都换成下一跳的硬件地址。跨网段时源主机把目的 MAC 写成网关入口地址。"
