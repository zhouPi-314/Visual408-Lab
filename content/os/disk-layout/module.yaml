questions:
  - id: q1
    kind: choice
    stem: 磁盘地址 CHS→LBA：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: LBA = ((C×磁头数)+H)×每道扇区数 + (S−1)；寻道是毫秒级，旋转是微秒级。
  - id: q2
    kind: hand-calculation
    stem: 磁盘地址 CHS→LBA：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
