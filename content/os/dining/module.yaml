    stem: 哲学家就餐：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "每人都先拿左手筷会形成环路等待；限制最多 n−1 人上桌、或让奇数号先拿右手筷，都能破坏死锁四个必要条件之一。"
