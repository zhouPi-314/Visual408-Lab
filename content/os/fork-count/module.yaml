    stem: fork 进程计数：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "fork 返回两次：父进程与子进程各自继续执行后续语句；n 次连续 fork 得到 2ⁿ 个进程，输出行数 = 进程数 × 语句数。"
