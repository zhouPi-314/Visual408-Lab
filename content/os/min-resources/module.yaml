questions:
  - id: q1
    kind: choice
    stem: 最少资源防死锁：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "最坏情况每个进程都持有 k−1 个还差 1 个；只要资源总数达到 n×(k−1)+1，必有一个进程能拿满并释放，系统不会死锁。"
  - id: q2
    kind: hand-calculation
    stem: 最少资源防死锁：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
