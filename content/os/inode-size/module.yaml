    stem: i 节点最大文件：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "每块指针数 P = 块大小/地址长度；最大文件块数 = 直接指针 + P + P² + P³（按间接级数），再乘块大小即容量。"
