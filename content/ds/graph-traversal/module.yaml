id: ds.graph-traversal
subject: ds
title: 图的遍历 BFS / DFS
syllabusVersion: "2026"
prerequisites:
  - 图的邻接矩阵表示
  - 队列与栈
related:
  - ds.binary-tree-traversal
  - ds.sorting
objectives:
  - 能按邻接矩阵顺序写出 BFS 与 DFS 的访问序列
  - 能解释为什么 BFS 用队列、DFS 用栈
  - 能指出遍历生成树的边数 = 访问结点数 − 1（连通图）
theory: theory.mdx
displayer: single-step
inputModes:
  - preset
  - custom
simulator: "@visual408/sim-core#ds.graph-traversal"
codeExamples: []
labTasks:
  - 把同一张图分别用 BFS 与 DFS 跑一遍，对比访问序列
  - 删掉一条边让图不连通，观察剩余结点的处理
questions:
  - id: q1
    kind: hand-calculation
    stem: 图 0-1、0-2、1-3、2-3、3-4，从 0 出发做 BFS，访问序列是什么？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "0 1 2 3 4"
    explanation: 先访问 0，把 1、2 入队；出队 1 → 发现 3；出队 2 → 3 已发现；出队 3 → 4；出队 4。
  - id: q2
    kind: choice
    stem: DFS 通常借助什么数据结构实现？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 栈
    explanation: DFS 后入先出，天然对应栈；递归实现时用的是系统调用栈。
tests: tests.json
sources:
  - label: 408 考试大纲·数据结构·图
  - label: 本项目原创教学复述
