questions:
  - id: q1
    kind: choice
    stem: 大根堆的插入与上浮：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: 插入放在数组末尾，然后与父结点比较并交换，直到父结点不小于自己。上浮路径长度不超过树高。
  - id: q2
    kind: hand-calculation
    stem: 大根堆的插入与上浮：请按界面给定的参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见界面指标"
    explanation: 把界面上的中间量与公式对照，注意单位与量纲。
