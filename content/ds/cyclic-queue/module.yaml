questions:
  - id: q1
    kind: choice
    stem: 循环队列的取模运算：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: 入队 rear=(rear+1)%n，出队 front=(front+1)%n；为了区分空与满，通常牺牲一个存储单元。
