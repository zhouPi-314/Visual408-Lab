    stem: 归并排序：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "把序列拆成有序小段，再两两归并；每轮段长翻倍，总比较次数约 n·log2 n，需要 O(n) 辅助空间。"
