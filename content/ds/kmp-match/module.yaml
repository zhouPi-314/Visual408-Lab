    kind: choice
    stem: KMP 匹配过程：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "失配时主串指针 i 不动，模式串指针 j 跳到 next[j−1]；next 记录每个前缀的最长相等前后缀长度。"
