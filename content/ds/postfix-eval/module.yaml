questions:
  - id: q1
    kind: choice
    stem: 中缀转后缀求值：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "操作数直接输出；操作符与栈顶比优先级，不高于就弹出；右括号弹到左括号。后缀式求值遇操作符弹两数，先弹出的是右操作数。"
  - id: q2
    kind: hand-calculation
    stem: 中缀转后缀求值：按界面参数手算一次并对照结果。
    source:
      kind: original
