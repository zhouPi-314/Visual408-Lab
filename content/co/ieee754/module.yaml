id: co.ieee754
subject: co
title: IEEE 754 浮点拆解
syllabusVersion: "2026"
prerequisites: []
related: []
objectives:
  - 能拆出符号位、阶码、尾数
  - 能算出偏移 127 后的阶码
  - 能由位串还原真值
theory: theory.mdx
displayer: single-step
inputModes:
  - preset
  - custom
simulator: "@visual408/sim-core#co.ieee754"
codeExamples: []
labTasks:
  - 改一个参数，观察哪一帧发生变化
questions:
  - id: q1
    kind: choice
    stem: IEEE 754 浮点拆解：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: 单精度为 1+8+23 位：符号 1 位，阶码用移码（偏移 127），尾数隐含最高位 1。
  - id: q2
    kind: hand-calculation
    stem: IEEE 754 浮点拆解：请按界面给定的参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见界面指标"
    explanation: 把界面上的中间量与公式对照，注意单位与量纲。
tests: tests.json
sources:
