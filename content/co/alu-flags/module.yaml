objectives:
  - 能算四个标志位
  - 能区分 CF 与 OF
  - 能判断结果是否可信
theory: theory.mdx
displayer: single-step
inputModes:
  - preset
  - custom
simulator: "@visual408/sim-core#co.alu-flags"
codeExamples: []
labTasks:
  - 点一个「快速场景」，对比不同参数下的结论
questions:
  - id: q1
    kind: choice
    stem: ALU 标志位与溢出：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "同一运算结果，无符号看 CF（进/借位），带符号看 OF（同号相加得异号，或异号相减得异号）；ZF 看零，SF 看符号位。"
  - id: q2
    kind: hand-calculation
    stem: ALU 标志位与溢出：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
tests: tests.json
sources:
