questions:
  - id: q1
    kind: choice
    stem: I/O 方式：查询 / 中断 / DMA：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: 程序查询让 CPU 全程等待；中断按次打断；DMA 由控制器搬运，CPU 只在首尾参与。
