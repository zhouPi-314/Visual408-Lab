questions:
  - id: q1
    kind: choice
    stem: 流水线性能指标：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "流水时间 = [(k−1)+n·(r+1)]·Δt；吞吐率 TP = n/流水时间；加速比 S = 顺序时间/流水时间；效率 E = S/k。"
  - id: q2
    kind: hand-calculation
    stem: 流水线性能指标：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
