questions:
  - id: q1
    kind: choice
    stem: 平均访问时间 AMAT：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: AMAT = 命中时间 + 缺失率 × 缺失代价。命中率提高会线性降低缺失带来的开销。
  - id: q2
    kind: hand-calculation
    stem: 平均访问时间 AMAT：请按界面给定的参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见界面指标"
    explanation: 把界面上的中间量与公式对照，注意单位与量纲。
