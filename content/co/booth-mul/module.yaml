    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "附加位 Q₋₁ 与乘数末位组成 01 加 M、10 减 M、00/11 不动，每步整体算术右移，n 步后 AQ 即 2n 位补码乘积。"
