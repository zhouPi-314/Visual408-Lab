    stem: 原码/反码/补码/移码：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: 补码等于反码加一；移码把补码的符号位取反，便于比较阶码大小。
