    stem: 存储器扩展：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: "位扩展用若干芯片并联凑字长；字扩展用多组串联凑容量，高位地址经译码器做片选。芯片总数 = 两组倍数之积。"
