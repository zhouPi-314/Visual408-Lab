  - 改一个参数，观察哪一帧发生变化
questions:
  - id: q1
    kind: choice
    stem: 指令格式与字段拆分：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见解析"
    explanation: 指令字由固定位置划分的字段组成，字段位宽决定可表示的寄存器编号与立即数范围。
  - id: q2
    kind: hand-calculation
    stem: 指令格式与字段拆分：请按界面给定的参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: "见界面指标"
    explanation: 把界面上的中间量与公式对照，注意单位与量纲。
