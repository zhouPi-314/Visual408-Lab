questions:
  - id: q1
    kind: choice
    stem: 寻址方式与有效地址：下列哪项描述是正确的？
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见解析
    explanation: 直接 EA=A；间接 EA=(A)；变址 EA=A+(R)；相对 EA=(PC)+A。
  - id: q2
    kind: hand-calculation
    stem: 寻址方式与有效地址：按界面参数手算一次并对照结果。
    source:
      kind: original
      license: original-work
      authorized: true
    answer: 见界面指标
    explanation: 把界面中间量与公式对照，注意单位与量纲。
