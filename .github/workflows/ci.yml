name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Clear TS incremental cache
        run: rm -f $(git ls-files '*.tsbuildinfo') 2>/dev/null || true

      - name: Typecheck
        run: pnpm typecheck:ci

      - name: Unit tests
        run: pnpm test

      - name: Content schema + copyright gate
        run: pnpm content:check

      - name: Privacy & secret scan
        run: node scripts/scan-secrets.mjs

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Build
        run: pnpm build